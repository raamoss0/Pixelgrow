<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixelgrow</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1b1f2b;color:#e8ecf5;font-family:system-ui,sans-serif}
  .box{width:min(92vw,420px);padding:24px;background:#252b3b;border-radius:14px}
  h1{margin:0 0 4px;font-size:26px}
  p{color:#9aa4bd;font-size:14px;line-height:1.5}
  input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 12px;border-radius:8px;border:1px solid #3a4258;background:#1b1f2b;color:#fff;font-size:16px}
  button{width:100%;padding:13px;border:0;border-radius:8px;background:#4f9cff;color:#fff;font-size:16px;font-weight:600}
  .hint{margin-top:14px;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <h1>Pixelgrow</h1>
  <p>Masukkan alamat server game. Jalankan server di Termux (HP ini) atau di komputer pada Wi-Fi yang sama.</p>
  <input id="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
  <button id="go">Masuk</button>
  <p class="hint">Di HP ini (Termux): <b>http://localhost:3000</b><br>Dari komputer: <b>http://192.168.x.x:3000</b> (alamat Wi-Fi yang tercetak di terminal server)</p>
</div>
<script>
  var KEY = 'pixelgrow_server';
  var input = document.getElementById('url');
  var saved = 'http://localhost:3000';
  try { saved = localStorage.getItem(KEY) || saved; } catch (e) {}
  input.value = saved;
  function go() {
    var u = input.value.trim();
    if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
    try { localStorage.setItem(KEY, u); } catch (e) {}
    window.location.href = u;
  }
  document.getElementById('go').onclick = go;
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
</script>
</body>
  </html>
